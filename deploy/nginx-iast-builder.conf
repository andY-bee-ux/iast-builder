# Exemple de configuration nginx : chaque instance derrière son propre nom de domaine, en HTTPS.
# Le brain n'est jamais exposé : seule la gateway est publiée.
server {
    listen 443 ssl;
    server_name yobakoko.exemple.org;
    # ssl_certificate     /etc/letsencrypt/live/yobakoko.exemple.org/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/yobakoko.exemple.org/privkey.pem;
    client_max_body_size 25m;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

server {
    listen 443 ssl;
    server_name afripharm.exemple.org;
    client_max_body_size 25m;
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
